# AgentDock 脚本治理清单。
# 分类：bootstrap / runtime-adapter / packaging / test / dev / legacy / ci
# 公开入口不得改名删除。legacy 脚本禁止新增产品能力。
# 超过 review_threshold_lines 的新增脚本必须写 oversize_justification。

review_threshold_lines: 300

scripts:
  - path: scripts/install/install.sh
    class: bootstrap
    owner: installer
    public_contract: true
    deletable: false
    legacy_oversize: true
    oversize_justification: 公开 Unix bootstrap，包含 Linux 交互菜单、校验下载和卸载转发；不得改名。
    notes: Unix 公开安装入口。只负责平台检测、交互、下载校验和 bootstrap，再调用 Go Installer Engine。

  - path: scripts/install/install.ps1
    class: runtime-adapter
    owner: installer
    public_contract: true
    deletable: false
    legacy_oversize: true
    oversize_justification: Windows 公开 bootstrap / Setup 契约；generation、stable shim、manifest 与事务由 Go Installer Engine 拥有，脚本保留 UAC/DPAPI/Registry/session 外层适配。
    notes: 公开 Windows 安装入口。UAC、DPAPI、Inno 结果文件和用户 session broker 仍留在脚本。

  - path: scripts/install/uninstall-windows.ps1
    class: runtime-adapter
    owner: installer
    public_contract: false
    deletable: false
    oversize_justification: Windows Setup 内部卸载适配器；stable binary 删除后仍需完成可重入 Installer transaction、Task/Registry 和进程占用文件清理。

  - path: scripts/install/launch-windows-process.ps1
    class: runtime-adapter
    owner: installer
    public_contract: false
    deletable: false
    notes: Setup RedirectionGuard 进程树到当前用户 interactive session 的内部薄 broker；通过原生 service task-start 选择 RunEx session。

  - path: scripts/install/probe-protected-text.ps1
    class: runtime-adapter
    owner: installer
    public_contract: false
    deletable: false
    notes: Windows Setup 的只读 DPAPI 可用性探针；只返回状态码，不输出凭据明文。

  - path: scripts/test/check-scripts.sh
    class: test
    owner: ci
    public_contract: false
    deletable: false

  - path: scripts/test/check-macos-i18n.py
    class: test
    owner: ci
    public_contract: false
    deletable: true

  - path: scripts/test/test_shell_variable_boundaries.py
