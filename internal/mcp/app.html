<body>
<main><div id="content" class="empty waiting-empty">Waiting for tool output…</div></main>
<script>
(()=>{
  "use strict";
  const expectedView="{{VIEW}}";
  const root=document.getElementById("content");
  let lastSerialized="";
  let rpcID=0;
  let lastReportedHeight=0;
  let resizeObserver=null;
  const pendingRequests=new Map();

  const el=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=String(text);return node};
  const isObject=value=>value!==null&&typeof value==="object"&&!Array.isArray(value);
  const scalar=value=>value===null||["string","number","boolean"].includes(typeof value);
  const actionLabel=value=>String(value||"").replaceAll("_"," ").toUpperCase();
  const rpcNotify=(method,params)=>window.parent.postMessage({jsonrpc:"2.0",method,params:params||{}},"*");
  const rpcRequest=(method,params)=>new Promise((resolve,reject)=>{
    const id=++rpcID;
    pendingRequests.set(id,{resolve,reject});
    window.parent.postMessage({jsonrpc:"2.0",id,method,params:params||{}},"*");
  });

  function reportSize(){
    const html=document.documentElement;
    const originalHeight=html.style.height;
    html.style.height="max-content";
    const height=Math.ceil(html.getBoundingClientRect().height);
    html.style.height=originalHeight;
    if(!height||height===lastReportedHeight)return;
    lastReportedHeight=height;
    rpcNotify("ui/notifications/size-changed",{height});
  }

  function startAutoResize(){
    if(typeof ResizeObserver!=="undefined"){
      resizeObserver=new ResizeObserver(reportSize);
      resizeObserver.observe(document.body);
      resizeObserver.observe(document.documentElement);
    }
    requestAnimationFrame(reportSize);
  }

  function compactShell(primary,rows,details){
    const wrapper=el("div","app-shell");
    const toggle=el("button","compact-toggle");
    if(primary.className)toggle.classList.add(primary.className);
    toggle.type="button";toggle.setAttribute("aria-expanded","false");
    const primaryWrap=el("span","compact-primary");
    if(primary.action)primaryWrap.append(el("strong","compact-action",actionLabel(primary.action)));
    primaryWrap.append(el("span","compact-title",primary.title||"AgentDock"));
    toggle.append(primaryWrap);
    const end=el("span","compact-end");
    end.append(el("span","brand","AgentDock"));end.append(el("span","chevron"));toggle.append(end);
    const compactRows=(rows||[]).filter(Boolean);
    if(compactRows.length){
      for(const row of compactRows){row.classList.add("compact-row");toggle.append(row)}
    }else{
      toggle.classList.add("single-line");
    }
    const panel=el("div","detail-panel");panel.hidden=true;panel.append(details);
    toggle.addEventListener("click",()=>{const expanded=toggle.getAttribute("aria-expanded")==="true";toggle.setAttribute("aria-expanded",String(!expanded));toggle.classList.toggle("expanded",!expanded);panel.hidden=expanded;requestAnimationFrame(reportSize)});
    wrapper.append(toggle,panel);
    root.classList.remove("empty","waiting-empty");
    root.replaceChildren(wrapper);
  }

  function taskProgress(steps){
    if(!steps.length)return null;
    const progress=el("span","compact-progress");
    let reached=-1,index=0;
    for(const step of steps){
      if(!isObject(step))continue;
      const status=String(step.status||"pending");
      const statusClass=status==="in_progress"?"in-progress":status;
      if(status==="completed"||status==="in_progress"||status==="blocked")reached=index;
      const node=el("span","progress-node "+statusClass);
      node.title=(step.title||step.id||"Step")+" · "+status;
      progress.append(node);index++;
    }
    if(!index)return null;
    const fill=el("span","progress-fill");
    const ratio=index===1?(reached===0?1:0):Math.max(0,reached)/(index-1);
    fill.style.width="calc((100% - 14px) * "+ratio+")";
    progress.prepend(fill);
    return progress;
  }

  function headline(fragment,action,primary,secondary){
    const line=el("div","headline");
    line.append(el("strong","action",actionLabel(action)||"STATUS"));
    if(primary)line.append(el("span","path",primary));
    if(secondary){line.append(el("span","arrow","→"));line.append(el("span","path",secondary))}
    fragment.append(line);
  }

  function metaLine(fragment,values){
    const valuesClean=values.filter(value=>value!==undefined&&value!==null&&value!=="");
    if(!valuesClean.length)return;
    const meta=el("div","meta");
    for(const value of valuesClean)meta.append(el("span","",value));
    fragment.append(meta);
  }

  function appendDiffPreview(fragment,diff){
    const pre=el("pre");
    let shown=0;
    for(const line of String(diff||"").split("\n")){
      if(line.startsWith("--- ")||line.startsWith("+++ ")||line.startsWith("@@")||line==="\\ No newline at end of file")continue;
      if(!line&&shown===0)continue;
      let cls="diff-line diff-context";
      if(line.startsWith("+"))cls="diff-line diff-add";else if(line.startsWith("-"))cls="diff-line diff-del";
      pre.append(el("span",cls,line+"\n"));shown++;
    }
    if(shown)fragment.append(pre);
  }

  function taskRecord(data){
    if(isObject(data.task))return data.task;
    if(isObject(data.task_summary))return data.task_summary;
    return {};
  }

  function contextItems(items){
    if(!Array.isArray(items))return [];
    return items.filter(isObject).map(item=>({name:String(item.name||"Item"),description:String(item.description||"")}));
  }

  function contextPill(value,label,className){
    const pill=el("span","context-pill "+(className||""));
    pill.append(el("strong","",value),document.createTextNode(label));
    return pill;
  }

  function appendContextOverview(parent,value,label){
    const card=el("div","context-overview-card");
    card.append(el("div","context-overview-value",value),el("div","context-overview-label",label));
    parent.append(card);
  }

  function appendContextSection(parent,title,items,limit,status){
    if(!items.length&&!status)return;
    const section=el("section","context-section");
    const head=el("div","context-section-head");
    head.append(el("div","context-section-title",title),el("div","context-section-count",status||String(items.length)));
    section.append(head);
    if(items.length){
      const list=el("div","context-list");
      for(const item of items.slice(0,limit)){
        const row=el("div","context-item");
        row.append(el("div","context-name",item.name||"Item"));
        if(item.description)row.append(el("div","context-desc",item.description));
        list.append(row);
      }
      if(items.length>limit)list.append(el("div","context-more","还有 "+(items.length-limit)+" 项"));
      section.append(list);
    }
    parent.append(section);
  }

  function appendTextOutput(fragment,label,text){
    if(typeof text!=="string"||!text)return;
    const section=el("div","context-section");
    section.append(el("div","context-section-title",label));
    section.append(el("pre","",text));
    fragment.append(section);

  function resultList(fragment,items,emptyText){
    const list=el("div","result-list");
    for(const item of items){
      if(!isObject(item))continue;
      const row=el("div","result-item");
      row.append(el("div","result-name",item.title||item.name||item.id||item.path||"Item"));
      const side=el("div","result-side");
      if(item.dotStatus){
        const state=String(item.dotStatus).toLowerCase();
        const dotClass=["ready","enabled","configured","completed","exited","success","ok"].includes(state)?" good":["failed","error","disabled","killed","timeout"].includes(state)?" bad":["running","in_progress","live"].includes(state)?" live":"";
        side.append(el("span","result-dot"+dotClass));
      }
      if(item.badge)side.append(el("span","result-badge",item.badge));
      if(item.score!==undefined&&item.score!==null&&item.score!=="")side.append(el("span","result-score",item.score));
      if(item.status)side.append(el("span","",item.status));
      if(side.childNodes.length)row.append(side);
      if(item.description)row.append(el("div","result-desc",item.description));
      if(item.path)row.append(el("div","result-path",item.path));

  function metricStrip(fragment,items){
    const clean=items.filter(item=>item&&item.value!==undefined&&item.value!==null&&item.value!=="");

  function detailFields(fragment,items){

  function humanBytes(value){
    const bytes=Number(value);if(!Number.isFinite(bytes)||bytes<0)return "";
    const units=["B","KB","MB","GB"];let size=bytes,index=0;
    while(size>=1024&&index<units.length-1){size/=1024;index++}
    return (index===0?String(Math.round(size)):size.toFixed(size>=10?1:2))+" "+units[index];
  }

  function compactPreviewText(value){
    return value===undefined||value===null?"":String(value).replace(/\s+/g," ").trim();
  }

  function compactResultFooter(preview,meta){
    const previewText=compactPreviewText(preview),metaText=compactPreviewText(meta);
    if(!previewText&&!metaText)return null;
    const row=el("span","compact-result-footer");
    row.append(el("span","compact-preview",previewText));
    if(metaText)row.append(el("span","compact-meta-row",metaText));
    return row;
  }

  function recallWriteState(data){

  function renderRecall(data){

  function renderFleetAgentContext(data){
    const nodes=Array.isArray(data.nodes)?data.nodes.filter(isObject):[];
    const online=nodes.filter(node=>node.online===true).length;
    const shared=isObject(data.shared)?data.shared:{};
    const fragment=document.createDocumentFragment();
    const tabs=el("div","context-node-tabs");
    const content=el("div","context-node-content");
    const buttons=[];
    const selectNode=index=>{
      const node=nodes[index];

      buttons.forEach((button,buttonIndex)=>{
        const active=buttonIndex===index;

      content.replaceChildren();
      if(!isObject(node.context)||node.error){

        content.append(unavailable);
        requestAnimationFrame(reportSize);
        return;
      }
      // Fleet 只负责选择设备；设备内容继续复用 AgentDock 单节点 Context 视图。
      appendNodeAgentContext(content,{
        skills:node.context.skills,
        dynamic_mcp:node.context.dynamic_mcp,
        acp:node.context.acp,
        workflow_templates:shared.workflow_templates,
        recall:shared.recall,
        rules:shared.rules,
        warnings:node.context.warnings

    for(const [index,node] of nodes.entries()){
      const button=el("button","context-node-tab");

      button.setAttribute("aria-pressed","false");
      const status=node.error?"不可用":(node.online===true?"在线":"离线");
      button.append(el("span","context-node-tab-name",node.name||node.node_id||"AgentDock"));
      button.append(el("span","context-node-tab-status",status));
      button.addEventListener("click",()=>selectNode(index));
      buttons.push(button);tabs.append(button);

    const fleetOverview=el("div","context-overview fleet-overview");
    appendContextOverview(fleetOverview,nodes.length,"Devices");
    appendContextOverview(fleetOverview,online,"Online");
    fragment.append(tabs,fleetOverview,content);

    const workflowCount=contextItems(shared.workflow_templates).length;
    const recallEnabled=isObject(shared.recall)&&shared.recall.enabled;
    const compact=el("span","compact-context");
    compact.append(contextPill(nodes.length,"Devices"),contextPill(online,"Online"),contextPill(workflowCount,"Workflow"),contextPill(recallEnabled?"ON":"OFF","Recall"));
    compactShell({action:"context",title:"Capabilities"},[compact],fragment);
    const initialIndex=Math.max(0,nodes.findIndex(node=>node.online===true&&isObject(node.context)&&!node.error));
    if(nodes.length)selectNode(initialIndex);

      if(count)fragment.append(grid);
    }
    compactShell({action:state.action||"status",title:identity},[session.status||state.status?el("span","compact-meta-row",session.status||state.status):null],fragment);
  }

  function renderable(data){
    if(!isObject(data))return false;
    if(data.view)return data.view===expectedView;
    if(expectedView==="agentdock_context")return Array.isArray(data.skills)||Array.isArray(data.nodes);
    if(expectedView==="file_change")return typeof data.action==="string"&&(data.path||data.workdir||data.changed!==undefined);
    if(expectedView==="task_progress")return typeof data.action==="string"&&(isObject(data.task)||isObject(data.task_summary)||Array.isArray(data.tasks)||data.task_id);
    if(expectedView==="recall")return Array.isArray(data.results)||typeof data.recall_action==="string";
    if(expectedView==="workflow")return data.action==="match"&&Array.isArray(data.candidates);
    if(expectedView==="dynamic_mcp")return typeof data.name==="string"&&isObject(data.result);
    if(expectedView==="artifact")return data.artifact_id||data.filename||data.url||data.sha256;
    if(expectedView==="acp_status")return typeof data.action==="string"&&(isObject(data.session)||Array.isArray(data.sessions)||data.session_id||isObject(data.agent)||data.authenticated!==undefined||data.deleted!==undefined);
    return false;
  }

  function render(data){
    if(!renderable(data))return;
    const serialized=JSON.stringify(data);if(serialized===lastSerialized)return;lastSerialized=serialized;
    if(expectedView==="agentdock_context")renderAgentContext(data);
    else if(expectedView==="task_progress")renderTask(data);
    else if(expectedView==="file_change")renderFileChange(data);
    else if(expectedView==="recall")renderRecall(data);
    else if(expectedView==="workflow")renderWorkflow(data);
    else if(expectedView==="dynamic_mcp")renderDynamicMCP(data);
    else if(expectedView==="artifact")renderArtifact(data);
    else renderACP(data);
    requestAnimationFrame(reportSize);
  }

  window.addEventListener("message",event=>{
    if(event.source!==window.parent)return;
    const message=event.data;
    if(!isObject(message)||message.jsonrpc!=="2.0")return;

    if(message.id!==undefined&&!message.method){
      const pending=pendingRequests.get(message.id);
      if(!pending)return;
      pendingRequests.delete(message.id);
      if(message.error)pending.reject(message.error);else pending.resolve(message.result);
      return;
    }

    if(message.method==="ui/notifications/tool-result"){
      const data=message.params&&message.params.structuredContent;
      if(isObject(data))render(data);
    }
  },{passive:true});

  async function initializeBridge(){
    try{
      await rpcRequest("ui/initialize",{
        appInfo:{name:"agentdock-"+expectedView,version:"1.0.0"},
        appCapabilities:{},
        protocolVersion:"2026-01-26"
      });
      rpcNotify("ui/notifications/initialized",{});
      startAutoResize();
    }catch(_){
      root.textContent="Unable to initialize MCP App.";
    }
  }

  initializeBridge();
})();
</script>
