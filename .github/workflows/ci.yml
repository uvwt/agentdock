name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        shell: bash
        run: |
          unformatted="$(git ls-files '*.go' | while IFS= read -r file; do gofmt -l "$file"; done)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./... -count=1 -timeout=3m

      - name: Check Windows test tree cleanliness
        if: runner.os == 'Windows'
        shell: bash
        run: |
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf 'Unexpected files created by tests:\n%s\n' "$untracked"
            exit 1
          fi

      - name: ACP prompt and steering race regression
        if: runner.os == 'Linux'
        timeout-minutes: 2
        shell: bash
        run: |
          go test -race ./internal/acp \
            -run 'Test(StartPromptWaitsForPromptDispatchBeforeSteering|ClaudeSteeringFallbackCancelsOldRunAndStartsObservableTurn|CodexSteeringFallbackCancelsOldRunAndStartsObservableTurn)$' \
            -count=20 \
            -timeout=90s

      - name: Race
        if: runner.os == 'Linux'
        run: go test -race ./... -count=1 -timeout=3m

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/agentdock

      - name: Check Linux scripts
        if: runner.os == 'Linux'
        run: make test-scripts

      - name: Test macOS scripts
        if: runner.os == 'macOS'
        run: make test-scripts-macos

      - name: Check Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-install-windows.ps1

      - name: Test Windows PowerShell DPAPI round trip
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Security

          $plainText = 'agentdock-dpapi-roundtrip'
          $entropy = [Text.Encoding]::UTF8.GetBytes('agentdock.startup.v1')
          $protectedBytes = [System.Security.Cryptography.ProtectedData]::Protect(
            [Text.Encoding]::UTF8.GetBytes($plainText),
            $entropy,
            [System.Security.Cryptography.DataProtectionScope]::CurrentUser
          )
          $unprotectedBytes = [System.Security.Cryptography.ProtectedData]::Unprotect(
            $protectedBytes,
            $entropy,
            [System.Security.Cryptography.DataProtectionScope]::CurrentUser
          )
          $actual = [Text.Encoding]::UTF8.GetString($unprotectedBytes)

          if ($actual -ne $plainText) {
            throw "DPAPI round trip mismatch. Expected '$plainText', got '$actual'."
          }


  browser-integration:
    name: Native browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Xvfb
        shell: bash
        run: |
          if command -v xvfb-run >/dev/null 2>&1 && command -v xauth >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends xvfb xauth

      - name: Browser integration race
        shell: bash
        run: |
          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$browser_path"
          xvfb-run -a env AGENTDOCK_BROWSER_EXECUTABLE_PATH="$browser_path" go test -race -tags browser_integration ./internal/tool/browser ./internal/app -count=1 -timeout=3m


  container:
    name: Container check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and verify images
        run: ./scripts/test/test-docker-images.sh
