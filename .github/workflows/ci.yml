name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        shell: bash
        run: |
          unformatted="$(git ls-files '*.go' | while IFS= read -r file; do gofmt -l "$file"; done)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Check Windows test tree cleanliness
        if: runner.os == 'Windows'
        shell: bash
        run: |
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf 'Unexpected files created by tests:\n%s\n' "$untracked"
            exit 1
          fi

      - name: Race
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/agentdock

      - name: Check Linux scripts
        if: runner.os == 'Linux'
        run: make test-scripts

      - name: Test macOS scripts
        if: runner.os == 'macOS'
        run: make test-scripts-macos

      - name: Check Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-install-windows.ps1

      - name: Test Windows PowerShell DPAPI round trip
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Security

          $plainText = 'agentdock-dpapi-roundtrip'
          $entropy = [Text.Encoding]::UTF8.GetBytes('agentdock.startup.v1')
          $protectedBytes = [System.Security.Cryptography.ProtectedData]::Protect(
            [Text.Encoding]::UTF8.GetBytes($plainText),
            $entropy,
            [System.Security.Cryptography.DataProtectionScope]::CurrentUser
          )
          $unprotectedBytes = [System.Security.Cryptography.ProtectedData]::Unprotect(
            $protectedBytes,
            $entropy,
            [System.Security.Cryptography.DataProtectionScope]::CurrentUser
          )
          $actual = [Text.Encoding]::UTF8.GetString($unprotectedBytes)

          if ($actual -ne $plainText) {
            throw "DPAPI round trip mismatch. Expected '$plainText', got '$actual'."
          }


  browser-integration:
    name: Native browser integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: Browser integration race
        shell: bash
        run: |
          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$browser_path"
          xvfb-run -a env AGENTDOCK_BROWSER_EXECUTABLE_PATH="$browser_path" go test -race -tags browser_integration ./internal/tool/browser ./internal/app -count=1


  container:
    name: Container check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify images
        run: ./scripts/test/test-docker-images.sh
