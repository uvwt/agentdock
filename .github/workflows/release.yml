name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

concurrency:
  group: release-publication
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  source:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate immutable release source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$source_commit" = "$tag_commit"

          # 正式发布只允许来自 main 的已合并提交，避免手工 tag 绕过主分支门禁。
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$source_commit" origin/main

          go run ./tools/release verify-version "$RELEASE_TAG"

          # 已公开 Release 视为不可变；只有明确的 HTTP 404 才表示尚未发布。
          release_api_error="$RUNNER_TEMP/release-api-error.log"
          if release_draft="$(gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" --jq .draft 2>"$release_api_error")"; then
            if [[ "$release_draft" == "false" ]]; then
              echo "Release $RELEASE_TAG is already published; published releases are immutable." >&2
              exit 1
            fi
          elif grep -Eq '\(HTTP 404\)$' "$release_api_error"; then
            :
          else
            cat "$release_api_error" >&2
            exit 1
          fi

          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: source
    name: Build Linux ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          asset="agentdock_linux_${GOARCH}.tar.gz"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          source_commit="$(git rev-parse HEAD)"
          mkdir -p dist/bin
          go build -trimpath \
            -ldflags="-s -w -X github.com/uvwt/agentdock/internal/buildinfo.Commit=${source_commit} -X github.com/uvwt/agentdock/internal/buildinfo.BuildDate=${build_date}" \
            -o dist/bin/agentdock ./cmd/agentdock
          python3 packaging/build-core-skill-bundle.py --output dist/share/agentdock/core-skills
          tar -C dist -czf "$asset" bin/agentdock share/agentdock/core-skills
          shasum -a 256 "$asset" > "$asset.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-linux-${{ matrix.goarch }}
          path: |
            agentdock_linux_${{ matrix.goarch }}.tar.gz
            agentdock_linux_${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

  build-macos:
    needs: source
    name: Build macOS ${{ matrix.goarch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          asset="agentdock_darwin_${GOARCH}.tar.gz"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          source_commit="$(git rev-parse HEAD)"
          mkdir -p dist/bin
          go build -trimpath \
            -ldflags="-s -w -X github.com/uvwt/agentdock/internal/buildinfo.Commit=${source_commit} -X github.com/uvwt/agentdock/internal/buildinfo.BuildDate=${build_date}" \
            -o dist/bin/agentdock ./cmd/agentdock
          python3 packaging/build-core-skill-bundle.py --output dist/share/agentdock/core-skills
          tar -C dist -czf "$asset" bin/agentdock share/agentdock/core-skills
          shasum -a 256 "$asset" > "$asset.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-macos-${{ matrix.goarch }}
          path: |
            agentdock_darwin_${{ matrix.goarch }}.tar.gz
            agentdock_darwin_${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

  build-macos-app:
    name: Build macOS offline DMG
    needs: [source, build-macos]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download AgentDock macOS payloads
        uses: actions/download-artifact@v4
        with:
          pattern: agentdock-macos-*
          path: payload
          merge-multiple: true

      - name: Prepare cloudflared macOS payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          for architecture in amd64 arm64; do
            archive="$RUNNER_TEMP/cloudflared-darwin-$architecture.tgz"
            extract_dir="$RUNNER_TEMP/cloudflared-$architecture"
            curl -fL --retry 5 --retry-delay 2 \
              "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-$architecture.tgz" \
              -o "$archive"
            mkdir -p "$extract_dir"
            tar -xzf "$archive" -C "$extract_dir"
            test -f "$extract_dir/cloudflared"
            test ! -L "$extract_dir/cloudflared"

            output="payload/cloudflared_darwin_$architecture"
            install -m 0755 "$extract_dir/cloudflared" "$output"
            case "$architecture" in
              arm64) expected_file_architecture='arm64' ;;
              amd64) expected_file_architecture='x86_64' ;;
            esac
            file_output="$(file "$output")"
            [[ "$file_output" == *"$expected_file_architecture"* ]]
            codesign --verify --deep --strict --verbose=2 "$output"
            (
              cd payload
              shasum -a 256 "cloudflared_darwin_$architecture" > "cloudflared_darwin_$architecture.sha256"
            )
          done

          (
            cd payload
            shasum -a 256 -c agentdock_darwin_amd64.tar.gz.sha256
            shasum -a 256 -c agentdock_darwin_arm64.tar.gz.sha256
            shasum -a 256 -c cloudflared_darwin_amd64.sha256
            shasum -a 256 -c cloudflared_darwin_arm64.sha256
          )

      - name: Validate menu app
        run: ./scripts/test/test-macos-app.sh

      - name: Build universal menu app
        env:
          AGENTDOCK_MACOS_ARCHES: arm64,x86_64
          AGENTDOCK_MACOS_APP_OUTPUT_DIR: dist/macos-app
          AGENTDOCK_MACOS_OFFLINE_PAYLOAD_DIR: ${{ github.workspace }}/payload
        run: packaging/macos/build-app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-macos-dmg
          path: |
            dist/macos-app/AgentDock-macos-universal.dmg
            dist/macos-app/AgentDock-macos-universal.dmg.sha256
            dist/macos-app/AgentDock-macos-universal.zip
            dist/macos-app/AgentDock-macos-universal.zip.sha256
          if-no-files-found: error

  build-windows:
    needs: source
    name: Build Windows ${{ matrix.goarch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Require Authenticode configuration
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            throw 'WINDOWS_SIGNING_CERT_BASE64 is required for a formal release.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            throw 'WINDOWS_SIGNING_CERT_PASSWORD is required for a formal release.'
          }

      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDate = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $sourceCommit = (git rev-parse HEAD).Trim()
          $ldflags = "-s -w -X github.com/uvwt/agentdock/internal/buildinfo.Commit=$sourceCommit -X github.com/uvwt/agentdock/internal/buildinfo.BuildDate=$buildDate"
          $runtimeIdentifier = if ($env:GOARCH -eq 'arm64') { 'win-arm64' } else { 'win-x64' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          go build -trimpath -ldflags $ldflags -o dist/agentdock.exe ./cmd/agentdock
          go build -trimpath -ldflags '-s -w' -o dist/agentdock-arbiter.exe ./cmd/agentdock-arbiter
          go build -trimpath -ldflags '-s -w' -o dist/agentdock-shim.exe ./cmd/agentdock-shim
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o dist/agentdock-tray-shim.exe ./cmd/agentdock-shim
          & .\packaging\windows\build-wsl-helper-payload.ps1 -OutputDirectory .\dist\wsl-helper
          dotnet publish .\desktop\windows\control-panel\AgentDock.ControlPanel.csproj `
            -c Release `
            -r $runtimeIdentifier `
            --self-contained true `
            -o dist\control-panel
          Copy-Item .\dist\control-panel\agentdock-tray.exe .\dist\agentdock-tray.exe -Force

      - name: Authenticode sign and verify
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          .\packaging\windows\sign-windows.ps1 -Path @(
            '.\dist\agentdock.exe',
            '.\dist\agentdock-tray.exe',
            '.\dist\agentdock-arbiter.exe',
            '.\dist\agentdock-shim.exe',
            '.\dist\agentdock-tray-shim.exe'
          )

      - name: Package
        shell: pwsh
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "agentdock_windows_$env:GOARCH.zip"
          python .\packaging\build-core-skill-bundle.py --output dist\share\agentdock\core-skills
          Copy-Item .\packaging\windows\assets\agentdock.ico dist\agentdock.ico -Force
          # v0.8.2/v0.8.3 updater 将 manage-windows.ps1 视为桌面归档必需项。
          # 当前运行时不再调用它；这里只保留 Release 契约，迁移成功后会从安装目录清理。
          Copy-Item .\packaging\windows\compat\manage-windows.ps1 dist\manage-windows.ps1 -Force
          Compress-Archive -Path dist\agentdock.exe, dist\agentdock-tray.exe, dist\agentdock-arbiter.exe, dist\agentdock-shim.exe, dist\agentdock-tray-shim.exe, dist\agentdock.ico, dist\manage-windows.ps1, dist\share, dist\wsl-helper -DestinationPath $asset -Force
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$asset.sha256", "$hash  $asset`n", [Text.UTF8Encoding]::new($false))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-windows-${{ matrix.goarch }}
          path: |
            agentdock_windows_${{ matrix.goarch }}.zip
            agentdock_windows_${{ matrix.goarch }}.zip.sha256
          if-no-files-found: error

  build-windows-setup:
    name: Build signed Windows offline Setup ${{ matrix.goarch }}
    needs: [source, build-windows]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Download Windows payload
        uses: actions/download-artifact@v4
        with:
          name: agentdock-windows-${{ matrix.goarch }}
          path: payload

      - name: Require Authenticode configuration
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            throw 'WINDOWS_SIGNING_CERT_BASE64 is required for a formal release.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            throw 'WINDOWS_SIGNING_CERT_PASSWORD is required for a formal release.'
          }

      - name: Download and verify cloudflared compatibility payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'payload\cloudflared.exe'
          Invoke-WebRequest `
            -UseBasicParsing `
            -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' `
            -OutFile $path
          $signature = Get-AuthenticodeSignature -LiteralPath $path
          if ($signature.Status -ne [Management.Automation.SignatureStatus]::Valid) {
            throw "cloudflared Authenticode signature is invalid: $($signature.StatusMessage)"
          }

      - name: Build and sign offline Setup
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          $version = $tag.TrimStart('v')
          $outputDir = Join-Path $PWD 'dist'
          & .\packaging\windows\build-windows-offline-setup.ps1 `
            -Version $version `
            -Architecture '${{ matrix.goarch }}' `
            -AgentDockArchive '.\payload\agentdock_windows_${{ matrix.goarch }}.zip' `
            -AgentDockChecksumFile '.\payload\agentdock_windows_${{ matrix.goarch }}.zip.sha256' `
            -CloudflaredBinary '.\payload\cloudflared.exe' `
            -OutputDirectory $outputDir `
            -SignedBuild

      - name: Upload Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-windows-setup-${{ matrix.goarch }}
          path: dist/AgentDockSetup-${{ matrix.goarch }}.exe
          if-no-files-found: error

  prepare-release:
    name: Prepare release candidate
    needs: [source, build-linux, build-macos, build-macos-app, build-windows, build-windows-setup]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package installers
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp scripts/install/install.sh dist/install.sh
          cp scripts/install/install.ps1 dist/install.ps1
          go run ./tools/release verify-version "$RELEASE_TAG"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          repository = os.environ["RELEASE_REPOSITORY"].lower()
          expected_version = tag.removeprefix("v")
          buildinfo_source = Path("internal/buildinfo/buildinfo.go").read_text()
          version_match = re.search(r'^\s*const\s+Version\s*=\s*"([^"]+)"', buildinfo_source, re.MULTILINE)
          if version_match is None:
              raise SystemExit("could not read buildinfo.Version from internal/buildinfo/buildinfo.go")
          actual_version = version_match.group(1)
          if actual_version != expected_version:
              raise SystemExit(f"release tag {tag} does not match buildinfo.Version {actual_version}")

          # Docker Compose / .env.example 不作为 Release 资产发布；
          # 文档直接引用仓库 main 或对应 git tag 上的源文件。
          installer_entry = Path("dist/install.sh")
          installer_text = installer_entry.read_text()
          default_base = "https://github.com/uvwt/agentdock/releases/latest/download"
          release_base = f"https://github.com/{repository}/releases/download/{tag}"
          if default_base not in installer_text:
              raise SystemExit("install.sh default release base was not found")
          installer_entry.write_text(installer_text.replace(default_base, release_base, 1))
          PY
          (
            cd dist
            for file in \
              install.sh \
              install.ps1 \
              AgentDockSetup-amd64.exe \
              AgentDockSetup-arm64.exe; do
              shasum -a 256 "$file" > "$file.sha256"
            done
          )
          go run ./tools/release verify-dist dist

      - name: Validate macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/AgentDock-macos-universal.dmg
          test -f dist/AgentDock-macos-universal.dmg.sha256
          test -f dist/AgentDock-macos-universal.zip
          test -f dist/AgentDock-macos-universal.zip.sha256
          (cd dist && shasum -a 256 -c AgentDock-macos-universal.zip.sha256)

      - name: Upload prepared release candidate
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  verify-linux-release:
    name: Verify staged Linux release
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Download prepared release
        uses: actions/download-artifact@v4
        with:
          name: agentdock-release-dist
          path: ${{ runner.temp }}/staged-release

      - name: Verify prepared checksums
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/staged-release"
          (
            cd "$release_dir"
            sha256sum -c install.sh.sha256
            sha256sum -c agentdock_linux_amd64.tar.gz.sha256
          )
          echo "STAGED_RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"

      - name: Install and uninstall staged assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          installer="$STAGED_RELEASE_DIR/install.sh"
          installer_tmp="$RUNNER_TEMP/installer"
          install_dir="$RUNNER_TEMP/agentdock-install"
          data_dir="$RUNNER_TEMP/agentdock-data"
          env_file="$RUNNER_TEMP/agentdock.env"
          port="$(python3 - <<'PORTPY'
          import socket
          sock = socket.socket()
          sock.bind(("127.0.0.1", 0))
          print(sock.getsockname()[1])
          sock.close()
          PORTPY
          )"
          release_base="http://127.0.0.1:$port"
          python3 -m http.server "$port" --bind 127.0.0.1 --directory "$STAGED_RELEASE_DIR" \
            >"$RUNNER_TEMP/staged-release-http.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$release_base/install.sh" >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat "$RUNNER_TEMP/staged-release-http.log"
              exit 1
            fi
            sleep 0.2
          done

          mkdir -p "$installer_tmp"
          TMPDIR="$installer_tmp" \
          AGENTDOCK_INSTALLER_BASE_URL="$release_base" \
          AGENTDOCK_NONINTERACTIVE=true \
          AGENTDOCK_INSTALL_MODE=binary \
          AGENTDOCK_RELEASE_VERSION="$RELEASE_TAG" \
          AGENTDOCK_SOURCE_DIR="$install_dir" \
          AGENTDOCK_DATA_DIR="$data_dir" \
          AGENTDOCK_ENV_FILE="$env_file" \
          AGENTDOCK_SERVICE_MANAGER=none \
          AGENTDOCK_SERVICE_USER="$(id -un)" \
          AGENTDOCK_AUTH_TOKEN=test-token \
            sh "$installer"

          "$install_dir/bin/agentdock" --help >/dev/null 2>&1
          for skill in agentdock-user-guide skill-authoring skill-installation; do
            test -f "$data_dir/.agentdock/skills/$skill/SKILL.md"
          done

          systemd_dir="$RUNNER_TEMP/systemd"
          openrc_dir="$RUNNER_TEMP/openrc"
          mkdir -p "$systemd_dir" "$openrc_dir"
          AGENTDOCK_INSTALLER_BASE_URL="$release_base" \
          AGENTDOCK_SOURCE_DIR="$install_dir" \
          AGENTDOCK_DATA_DIR="$data_dir" \
          AGENTDOCK_ENV_FILE="$env_file" \
          AGENTDOCK_SYSTEMD_DIR="$systemd_dir" \
          AGENTDOCK_OPENRC_DIR="$openrc_dir" \
            sh "$installer" --uninstall --purge-data

          test ! -e "$install_dir"
          test ! -e "$data_dir"
          test ! -e "$env_file"

  verify-macos-release:
    name: Verify staged macOS release
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - name: Download prepared release
        uses: actions/download-artifact@v4
        with:
          name: agentdock-release-dist
          path: ${{ runner.temp }}/staged-release

      - name: Prepare staged asset paths
        shell: zsh {0}
        run: |
          echo "STAGED_RELEASE_DIR=$RUNNER_TEMP/staged-release" >> "$GITHUB_ENV"

      - name: Verify staged app and unified installer
        shell: zsh {0}
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          installer="$STAGED_RELEASE_DIR/install.sh"
          dmg="$STAGED_RELEASE_DIR/AgentDock-macos-universal.dmg"
          zip="$STAGED_RELEASE_DIR/AgentDock-macos-universal.zip"
          zip_dir="$RUNNER_TEMP/agentdock-zip"
          mount_dir="$RUNNER_TEMP/agentdock-dmg"
          port="$(python3 - <<'PORTPY'
          import socket
          sock = socket.socket()
          sock.bind(("127.0.0.1", 0))
          print(sock.getsockname()[1])
          sock.close()
          PORTPY
          )"
          release_base="http://127.0.0.1:$port"
          python3 -m http.server "$port" --bind 127.0.0.1 --directory "$STAGED_RELEASE_DIR" \
            >"$RUNNER_TEMP/staged-release-http.log" 2>&1 &
          server_pid=$!
          dmg_mounted=false
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            if [[ "$dmg_mounted" == true ]]; then
              hdiutil detach "$mount_dir" -force >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          (
            cd "$STAGED_RELEASE_DIR"
            shasum -a 256 -c AgentDock-macos-universal.dmg.sha256
            shasum -a 256 -c AgentDock-macos-universal.zip.sha256
            shasum -a 256 -c install.sh.sha256
          )

          mkdir -p "$zip_dir"
          ditto -x -k "$zip" "$zip_dir"
          test -d "$zip_dir/AgentDock.app"
          codesign --verify --deep --strict --verbose=2 "$zip_dir/AgentDock.app"
          hdiutil verify "$dmg" >/dev/null
          mkdir -p "$mount_dir"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg" >/dev/null
          dmg_mounted=true
          mounted_entries="$(find "$mount_dir" -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort)"
          test "$mounted_entries" = $'AgentDock.app\nApplications'
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = "/Applications"
          codesign --verify --deep --strict --verbose=2 "$mount_dir/AgentDock.app"

          app_arches="$(lipo -archs "$mount_dir/AgentDock.app/Contents/MacOS/AgentDock")"
          helper_arches="$(lipo -archs "$mount_dir/AgentDock.app/Contents/Helpers/AgentDockLoginHelper")"
          core_arches="$(lipo -archs "$mount_dir/AgentDock.app/Contents/Helpers/agentdock")"
          cloudflared_arches="$(lipo -archs "$mount_dir/AgentDock.app/Contents/Helpers/cloudflared")"
          [[ "$app_arches" == *arm64* && "$app_arches" == *x86_64* ]]
          [[ "$helper_arches" == *arm64* && "$helper_arches" == *x86_64* ]]
          [[ "$core_arches" == *arm64* && "$core_arches" == *x86_64* ]]
          [[ "$cloudflared_arches" == *arm64* && "$cloudflared_arches" == *x86_64* ]]
          cmp "$zip_dir/AgentDock.app/Contents/MacOS/AgentDock" "$mount_dir/AgentDock.app/Contents/MacOS/AgentDock"
          cmp "$zip_dir/AgentDock.app/Contents/Helpers/AgentDockLoginHelper" "$mount_dir/AgentDock.app/Contents/Helpers/AgentDockLoginHelper"
          cmp "$zip_dir/AgentDock.app/Contents/Helpers/agentdock" "$mount_dir/AgentDock.app/Contents/Helpers/agentdock"
          cmp "$zip_dir/AgentDock.app/Contents/Helpers/cloudflared" "$mount_dir/AgentDock.app/Contents/Helpers/cloudflared"
          test -f "$mount_dir/AgentDock.app/Contents/Resources/core-skills/manifest.json"

          core_plist="$mount_dir/AgentDock.app/Contents/Library/LaunchAgents/com.uvwt.agentdock.core.plist"
          tunnel_plist="$mount_dir/AgentDock.app/Contents/Library/LaunchAgents/com.uvwt.agentdock.tunnel.plist"
          plutil -lint "$core_plist" >/dev/null
          plutil -lint "$tunnel_plist" >/dev/null
          test "$(plutil -extract BundleProgram raw -o - "$core_plist")" = "Contents/Helpers/agentdock"
          test "$(plutil -extract BundleProgram raw -o - "$tunnel_plist")" = "Contents/Helpers/agentdock"
          codesign --verify --strict --verbose=2 "$mount_dir/AgentDock.app/Contents/Helpers/agentdock"
          codesign --verify --strict --verbose=2 "$mount_dir/AgentDock.app/Contents/Helpers/cloudflared"
          mounted_core_version="$("$mount_dir/AgentDock.app/Contents/Helpers/agentdock" --version)"
          [[ "$mounted_core_version" == *"AgentDock $RELEASE_TAG"* ]]
          "$mount_dir/AgentDock.app/Contents/Helpers/cloudflared" --version >/dev/null
          hdiutil detach "$mount_dir" >/dev/null
          dmg_mounted=false

          for attempt in $(seq 1 30); do
            if curl -fsS "$release_base/install.sh" >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat "$RUNNER_TEMP/staged-release-http.log"
              exit 1
            fi
            sleep 0.2
          done

          sh -n "$installer"
          HOME="$RUNNER_TEMP/home" \
          AGENTDOCK_INSTALLER_BASE_URL="$release_base" \
          AGENTDOCK_INSTALL_DIR="$RUNNER_TEMP/bin" \
            sh "$installer" --version "$RELEASE_TAG"
          "$RUNNER_TEMP/bin/agentdock" --help >/dev/null 2>&1
          for skill in agentdock-user-guide skill-authoring skill-installation; do
            test -f "$RUNNER_TEMP/home/.agentdock/skills/$skill/SKILL.md"
          done
          HOME="$RUNNER_TEMP/home" \
          AGENTDOCK_INSTALLER_BASE_URL="$release_base" \
          AGENTDOCK_INSTALL_DIR="$RUNNER_TEMP/bin" \
            sh "$installer" --uninstall --purge-data \
              --agentdock-home "$RUNNER_TEMP/home/.agentdock" \
              --agentdock-default-dir "$RUNNER_TEMP/home/AgentDock"
          test ! -e "$RUNNER_TEMP/bin/agentdock"
          test ! -e "$RUNNER_TEMP/home/.agentdock"

  verify-windows-release:
    name: Verify staged Windows release
    needs: [source, prepare-release]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Download prepared release
        uses: actions/download-artifact@v4
        with:
          name: agentdock-release-dist
          path: ${{ runner.temp }}/staged-release

      - name: Prepare staged assets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'staged-release'
          $installer = Join-Path $releaseRoot 'install.ps1'
          $setup = Join-Path $releaseRoot 'AgentDockSetup-amd64.exe'
          $legacyArchive = Join-Path $releaseRoot 'agentdock_windows_amd64.zip'
          foreach ($path in @($installer, $setup, $legacyArchive)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Staged release asset is missing: $path"
            }
          }

          # 候选产物中的 install.ps1 必须与 tag 源码完全一致，防止 workflow/source SHA 混用。
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath '.\scripts\install\install.ps1' -Algorithm SHA256).Hash) {
            throw 'Staged install.ps1 does not match the tagged source.'
          }

          foreach ($asset in @('install.ps1', 'AgentDockSetup-amd64.exe', 'agentdock_windows_amd64.zip')) {
            $assetPath = Join-Path $releaseRoot $asset
            $checksumPath = "$assetPath.sha256"
            $expected = ((Get-Content -LiteralPath $checksumPath -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "Staged checksum mismatch: $asset"
            }
          }

          $legacyRoot = Join-Path $env:RUNNER_TEMP 'agentdock-release-legacy-fixture'
          Remove-Item -LiteralPath $legacyRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $legacyArchive -DestinationPath $legacyRoot -Force
          $legacyCore = Join-Path $legacyRoot 'agentdock.exe'
          $legacyTray = Join-Path $legacyRoot 'agentdock-tray.exe'
          if (-not (Test-Path -LiteralPath $legacyCore -PathType Leaf) -or
              -not (Test-Path -LiteralPath $legacyTray -PathType Leaf)) {
            throw 'Staged Windows archive is missing the legacy migration fixture binaries.'
          }

          "STAGED_RELEASE_ROOT=$releaseRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "STAGED_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "STAGED_SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "LEGACY_CORE_PATH=$legacyCore" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "LEGACY_TRAY_PATH=$legacyTray" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

      - name: Verify staged Setup signature
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          .\packaging\windows\sign-windows.ps1 -Path $env:STAGED_SETUP -VerifyOnly

      - name: Install and uninstall staged Setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-windows-setup-e2e.ps1 `
            -SetupPath $env:STAGED_SETUP `
            -LegacyCorePath $env:LEGACY_CORE_PATH `
            -LegacyTrayPath $env:LEGACY_TRAY_PATH `
            -AllowLegacyTaskMutation

      - name: Install and upgrade staged version as standard user
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([Net.IPEndPoint] $listener.LocalEndpoint).Port
          $listener.Stop()
          $releaseBaseUrl = "http://127.0.0.1:$port"
          $server = Start-Process `
            -FilePath 'python' `
            -ArgumentList @('-m', 'http.server', $port, '--bind', '127.0.0.1', '--directory', $env:STAGED_RELEASE_ROOT) `
            -WindowStyle Hidden `
            -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 250
              try {
                Invoke-WebRequest -UseBasicParsing -Uri "$releaseBaseUrl/install.ps1" -TimeoutSec 2 | Out-Null
                break
              } catch {
                if ([DateTime]::UtcNow -ge $deadline) { throw }
              }
            } while ($true)

            & .\scripts\test\run-windows-installer-e2e-as-standard-user.ps1 `
              -InstallerPath $env:STAGED_INSTALLER `
              -Version $env:RELEASE_TAG `
              -ReleaseBaseUrl $releaseBaseUrl
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  release-gate:
    name: Release pre-publication gate
    if: always()
    needs: [prepare-release, verify-linux-release, verify-macos-release, verify-windows-release]
    runs-on: ubuntu-latest
    steps:
      - name: Require all staged release checks
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare-release.result }}
          LINUX_RESULT: ${{ needs.verify-linux-release.result }}
          MACOS_RESULT: ${{ needs.verify-macos-release.result }}
          WINDOWS_RESULT: ${{ needs.verify-windows-release.result }}
        run: |
          set -euo pipefail
          for result in "$PREPARE_RESULT" "$LINUX_RESULT" "$MACOS_RESULT" "$WINDOWS_RESULT"; do
            test "$result" = success
          done

  stage-release:
    name: Stage draft GitHub Release
    needs: [prepare-release, release-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Download validated release candidate
        uses: actions/download-artifact@v4
        with:
          name: agentdock-release-dist
          path: dist

      - name: Reset previous draft for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Draft 不能稳定通过 releases/tags/<tag> 查询；按 releases 列表清理同 tag 草稿，
          # 让失败后的同 tag 重跑始终从唯一、干净的 staging release 开始。
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$RELEASE_TAG\") | .id" \
            > "$RUNNER_TEMP/stale-draft-ids"
          while IFS= read -r release_id; do
            [[ -z "$release_id" ]] && continue
            gh api --method DELETE "repos/${{ github.repository }}/releases/$release_id"
          done < "$RUNNER_TEMP/stale-draft-ids"

      - name: Upload validated draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          overwrite_files: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/*.sh
            dist/*.sh.sha256
            dist/*.ps1
            dist/*.ps1.sha256
            dist/*.exe
            dist/*.exe.sha256
          generate_release_notes: true

  publish-container:
    name: Publish containers
    needs: [source, stage-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image build metadata
        id: build
        shell: bash
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Prepare runtime image metadata
        id: meta-runtime
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            agentdockio/agentdock
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.source.outputs.tag }},priority=1000
          labels: |
            org.opencontainers.image.revision=${{ needs.source.outputs.commit }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-runtime.outputs.tags }}
          labels: ${{ steps.meta-runtime.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ needs.source.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime,ignore-error=true

      - name: Prepare dev image metadata
        id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            agentdockio/agentdock
          flavor: latest=false
          tags: |
            type=raw,value=dev-${{ needs.source.outputs.tag }},priority=1000
          labels: |
            org.opencontainers.image.revision=${{ needs.source.outputs.commit }}

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ needs.source.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: |
            type=gha,scope=runtime
            type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev,ignore-error=true

      - name: Prepare browser image metadata
        id: meta-browser
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            agentdockio/agentdock
          flavor: latest=false
          tags: |
            type=raw,value=browser-${{ needs.source.outputs.tag }},priority=1000
          labels: |
            org.opencontainers.image.revision=${{ needs.source.outputs.commit }}

      - name: Build and push browser image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: browser
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-browser.outputs.tags }}
          labels: ${{ steps.meta-browser.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ needs.source.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: |
            type=gha,scope=runtime
            type=gha,scope=browser
          cache-to: type=gha,mode=max,scope=browser,ignore-error=true

  verify-container:
    name: Verify versioned containers
    needs: [source, publish-container]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.commit }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run versioned GHCR images
        env:
          AGENTDOCK_TEST_BUILD: "false"
          AGENTDOCK_TEST_RUNTIME_IMAGE: ghcr.io/${{ github.repository }}:${{ needs.source.outputs.tag }}
          AGENTDOCK_TEST_DEV_IMAGE: ghcr.io/${{ github.repository }}:dev-${{ needs.source.outputs.tag }}
          AGENTDOCK_TEST_BROWSER_IMAGE: ghcr.io/${{ github.repository }}:browser-${{ needs.source.outputs.tag }}
          AGENTDOCK_EXPECT_IMAGE_VERSION: ${{ needs.source.outputs.tag }}
        run: ./scripts/test/test-docker-images.sh

      - name: Run versioned Docker Hub images
        env:
          AGENTDOCK_TEST_BUILD: "false"
          AGENTDOCK_TEST_RUNTIME_IMAGE: agentdockio/agentdock:${{ needs.source.outputs.tag }}
          AGENTDOCK_TEST_DEV_IMAGE: agentdockio/agentdock:dev-${{ needs.source.outputs.tag }}
          AGENTDOCK_TEST_BROWSER_IMAGE: agentdockio/agentdock:browser-${{ needs.source.outputs.tag }}
          AGENTDOCK_EXPECT_IMAGE_VERSION: ${{ needs.source.outputs.tag }}
        run: ./scripts/test/test-docker-images.sh

  publish-release:
    name: Promote aliases and publish GitHub Release
    needs: [source, stage-release, verify-container]
    runs-on: ubuntu-latest
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote validated mutable aliases
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          set -euo pipefail

          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' | tr -d '"'
          }

          promote() {
            local source_ref="$1"
            local target_ref="$2"
            local source_digest
            local target_digest

            source_digest="$(digest_of "$source_ref")"
            test -n "$source_digest"
            docker buildx imagetools create --tag "$target_ref" "$source_ref"
            target_digest="$(digest_of "$target_ref")"
            test "$target_digest" = "$source_digest"
          }

          promote "ghcr.io/${{ github.repository }}:$RELEASE_TAG" "ghcr.io/${{ github.repository }}:latest"
          promote "ghcr.io/${{ github.repository }}:dev-$RELEASE_TAG" "ghcr.io/${{ github.repository }}:dev-latest"
          promote "ghcr.io/${{ github.repository }}:browser-$RELEASE_TAG" "ghcr.io/${{ github.repository }}:browser-latest"

          promote "agentdockio/agentdock:$RELEASE_TAG" "agentdockio/agentdock:latest"
          promote "agentdockio/agentdock:dev-$RELEASE_TAG" "agentdockio/agentdock:dev-latest"
          promote "agentdockio/agentdock:browser-$RELEASE_TAG" "agentdockio/agentdock:browser-latest"

      - name: Publish validated draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest
