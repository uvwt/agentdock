name: Windows Installer

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Optional temporary prerelease tag, for example v0.5.4-windows-test-20260802-1'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changes:
    name: Detect Windows installer changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether installer validation is required
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_paths="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            scripts/install \
            ':(glob)scripts/test/*windows*.ps1' \
            packaging/windows \
            packaging/build-core-skill-bundle.py \
            desktop/windows \
            cmd/agentdock \
            cmd/agentdock-arbiter \
            cmd/agentdock-shim \
            cmd/agentdock-wsl-helper \
            internal/auth \
            internal/buildinfo \
            internal/config \
            internal/desktopruntime \
            internal/envstore \
            internal/fs/securepath \
            internal/installer \
            internal/selfupdate \
            internal/updateengine \
            internal/updateplatform \
            internal/wslfilehelper \
            scripts/test/testdata/fake-cloudflared \
            go.mod \
            go.sum \
            .github/workflows/windows-installer.yml \
            .github/workflows/release.yml)"
          if [[ -n "$changed_paths" ]]; then
            printf 'Windows installer validation required by:\n%s\n' "$changed_paths"
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No Windows installer-relevant changes detected.'
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate installer on Windows PowerShell 5.1
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Backward-compatibility gate checks the published v0.8.2/v0.8.3 updater source.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Test Setup runtime diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeTestAgentDockBinary = Join-Path $env:RUNNER_TEMP 'agentdock-runtime-launch-test.exe'
          $runtimeTestHiddenHostBinary = Join-Path $env:RUNNER_TEMP 'agentdock-runtime-host-test.exe'
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -o $runtimeTestAgentDockBinary .\cmd\agentdock
          go build -trimpath -ldflags '-H=windowsgui' -o $runtimeTestHiddenHostBinary .\cmd\agentdock-shim
          & .\scripts\test\test-windows-runtime-launch-diagnostics.ps1 `
            -LauncherPath .\scripts\install\launch-windows-process.ps1 `
            -AgentDockBinary $runtimeTestAgentDockBinary `
            -HiddenHostBinary $runtimeTestHiddenHostBinary

      - name: Run full install and in-place upgrade as standard user
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'agentdock-current-release'
          $distRoot = Join-Path $releaseRoot 'dist'
          $bundleRoot = Join-Path $distRoot 'share\agentdock\core-skills'
          New-Item -ItemType Directory -Path $distRoot -Force | Out-Null

          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -o (Join-Path $distRoot 'agentdock.exe') .\cmd\agentdock
          go build -trimpath -ldflags '-s -w' -o (Join-Path $distRoot 'agentdock-arbiter.exe') .\cmd\agentdock-arbiter
          go build -trimpath -ldflags '-s -w' -o (Join-Path $distRoot 'agentdock-shim.exe') .\cmd\agentdock-shim
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o (Join-Path $distRoot 'agentdock-tray-shim.exe') .\cmd\agentdock-shim
          $controlPanelOutput = Join-Path $distRoot 'control-panel'
          dotnet publish .\desktop\windows\control-panel\AgentDock.ControlPanel.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $controlPanelOutput
          Copy-Item (Join-Path $controlPanelOutput 'agentdock-tray.exe') (Join-Path $distRoot 'agentdock-tray.exe') -Force
          Copy-Item .\packaging\windows\assets\agentdock.ico (Join-Path $distRoot 'agentdock.ico') -Force
          Copy-Item .\packaging\windows\compat\manage-windows.ps1 (Join-Path $distRoot 'manage-windows.ps1') -Force
          python .\packaging\build-core-skill-bundle.py --output $bundleRoot
          & .\packaging\windows\build-wsl-helper-payload.ps1 -OutputDirectory (Join-Path $distRoot 'wsl-helper')

          $assetName = 'agentdock_windows_amd64.zip'
          $archivePath = Join-Path $releaseRoot $assetName
          Compress-Archive `
            -Path (Join-Path $distRoot 'agentdock.exe'), (Join-Path $distRoot 'agentdock-tray.exe'), (Join-Path $distRoot 'agentdock-arbiter.exe'), (Join-Path $distRoot 'agentdock-shim.exe'), (Join-Path $distRoot 'agentdock-tray-shim.exe'), (Join-Path $distRoot 'agentdock.ico'), (Join-Path $distRoot 'manage-windows.ps1'), (Join-Path $distRoot 'share'), (Join-Path $distRoot 'wsl-helper') `
            -DestinationPath $archivePath `
            -Force
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "$archivePath.sha256",
            "$hash  $assetName`n",
            [Text.UTF8Encoding]::new($false)
          )

          & .\scripts\test\test-windows-release-backcompat.ps1 -ArchivePath $archivePath

          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([Net.IPEndPoint] $listener.LocalEndpoint).Port
          $listener.Stop()
          $releaseBaseUrl = "http://127.0.0.1:$port"
          $server = Start-Process `
            -FilePath 'python' `
            -ArgumentList @('-m', 'http.server', $port, '--bind', '127.0.0.1', '--directory', $releaseRoot) `
            -WindowStyle Hidden `
            -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 250
              try {
                Invoke-WebRequest -UseBasicParsing -Uri "$releaseBaseUrl/$assetName.sha256" -TimeoutSec 2 | Out-Null
                break
              } catch {
                if ([DateTime]::UtcNow -ge $deadline) { throw }
              }
            } while ($true)

            & .\scripts\test\run-windows-installer-e2e-as-standard-user.ps1 `
              -InstallerPath .\scripts\install\install.ps1 `
              -Version latest `
              -ReleaseBaseUrl $releaseBaseUrl
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Build current Windows binary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -o dist\agentdock.exe .\cmd\agentdock
          go build -trimpath -ldflags '-s -w' -o dist\agentdock-arbiter.exe .\cmd\agentdock-arbiter
          go build -trimpath -ldflags '-s -w' -o dist\agentdock-shim.exe .\cmd\agentdock-shim
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o dist\agentdock-tray-shim.exe .\cmd\agentdock-shim
          dotnet publish .\desktop\windows\control-panel\AgentDock.ControlPanel.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o dist\control-panel
          Copy-Item .\dist\control-panel\agentdock-tray.exe .\dist\agentdock-tray.exe -Force
          & .\packaging\windows\build-wsl-helper-payload.ps1 -OutputDirectory .\dist\wsl-helper

      - name: Test configured Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.test_tag }}')) {
              throw 'Windows signing secrets are required for a test package.'
            }
            Write-Host 'Windows signing secrets are not configured; skipping Authenticode integration test.'
            exit 0
          }

          $paths = @(
            '.\dist\agentdock.exe',
            '.\dist\agentdock-tray.exe',
            '.\dist\agentdock-arbiter.exe',
            '.\dist\agentdock-shim.exe',
            '.\dist\agentdock-tray-shim.exe'
          )
          .\packaging\windows\sign-windows.ps1 -Path $paths
          .\packaging\windows\sign-windows.ps1 -Path $paths -VerifyOnly

      - name: Prepare offline AMD64 payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payloadRoot = Join-Path $env:RUNNER_TEMP 'agentdock-offline-amd64'
          Remove-Item -LiteralPath $payloadRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $payloadRoot -Force | Out-Null

          python .\packaging\build-core-skill-bundle.py --output .\dist\share\agentdock\core-skills
          Copy-Item .\packaging\windows\assets\agentdock.ico .\dist\agentdock.ico -Force
          Copy-Item .\packaging\windows\compat\manage-windows.ps1 .\dist\manage-windows.ps1 -Force
          $archivePath = Join-Path $payloadRoot 'agentdock_windows_amd64.zip'
          Compress-Archive `
            -Path .\dist\agentdock.exe, .\dist\agentdock-tray.exe, .\dist\agentdock-arbiter.exe, .\dist\agentdock-shim.exe, .\dist\agentdock-tray-shim.exe, .\dist\agentdock.ico, .\dist\manage-windows.ps1, .\dist\share, .\dist\wsl-helper `
            -DestinationPath $archivePath `
            -Force
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$archivePath.sha256"
          [IO.File]::WriteAllText($checksumPath, "$hash  agentdock_windows_amd64.zip`n", [Text.UTF8Encoding]::new($false))

          "AMD64_ARCHIVE=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "AMD64_CHECKSUM=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

      - name: Test legacy flat to generation migration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-windows-legacy-online-migration.ps1 `
            -ArchivePath $env:AMD64_ARCHIVE `
            -ChecksumPath $env:AMD64_CHECKSUM
          & .\scripts\test\test-windows-legacy-online-migration.ps1 `
            -ArchivePath $env:AMD64_ARCHIVE `
            -ChecksumPath $env:AMD64_CHECKSUM `
            -InjectTrayReplaceFailure

      - name: Download and verify cloudflared compatibility payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $cloudflaredPath = Join-Path $env:RUNNER_TEMP 'cloudflared-windows-amd64.exe'
          $cloudflaredUrl = 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe'
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri $cloudflaredUrl -OutFile $cloudflaredPath
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds 2
            }
          }
          $cloudflaredSignature = Get-AuthenticodeSignature -LiteralPath $cloudflaredPath
          if ($cloudflaredSignature.Status -ne [Management.Automation.SignatureStatus]::Valid) {
            throw "cloudflared Authenticode signature is invalid: $($cloudflaredSignature.StatusMessage)"
          }
          "AMD64_CLOUDFLARED=$cloudflaredPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

      - name: Test Quick Tunnel restart lifecycle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fakeCloudflared = Join-Path $env:RUNNER_TEMP 'fake-cloudflared.exe'
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -o $fakeCloudflared .\scripts\test\testdata\fake-cloudflared
          & .\scripts\test\test-windows-quick-tunnel-lifecycle.ps1 `
            -InstallerPath .\scripts\install\install.ps1 `
            -UninstallerPath .\scripts\install\uninstall-windows.ps1 `
            -AgentDockArchive $env:AMD64_ARCHIVE `
            -AgentDockChecksumFile $env:AMD64_CHECKSUM `
            -FakeCloudflaredBinary $fakeCloudflared

      - name: Test Named Tunnel install update and soft-failure recovery lifecycle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'

          $fakeCloudflared = Join-Path $env:RUNNER_TEMP 'fake-cloudflared-named.exe'
          go build -trimpath -o $fakeCloudflared .\scripts\test\testdata\fake-cloudflared

          function Build-VersionedAgentDock {
            param([string] $Version, [string] $OutputPath)

            $sourcePath = (Resolve-Path '.\internal\buildinfo\buildinfo.go').Path
            $source = Get-Content -LiteralPath $sourcePath -Raw
            $replacement = [regex]::Replace(
              $source,
              'const Version = "[^"]+"',
              "const Version = `"$Version`"",
              1
            )
            if ($replacement -eq $source) {
              throw 'Could not replace buildinfo.Version for Named Tunnel E2E.'
            }

            $replacementPath = Join-Path $env:RUNNER_TEMP "buildinfo-$Version.go"
            $overlayPath = Join-Path $env:RUNNER_TEMP "buildinfo-$Version-overlay.json"
            [IO.File]::WriteAllText($replacementPath, $replacement, [Text.UTF8Encoding]::new($false))
            $replacements = @{}
            $replacements[$sourcePath] = $replacementPath
            [IO.File]::WriteAllText(
              $overlayPath,
              (@{ Replace = $replacements } | ConvertTo-Json -Depth 4),
              [Text.UTF8Encoding]::new($false)
            )
            go build -trimpath -overlay $overlayPath -o $OutputPath .\cmd\agentdock
          }

          $sourceCore = Join-Path $env:RUNNER_TEMP 'agentdock-named-source.exe'
          $trialCore = Join-Path $env:RUNNER_TEMP 'agentdock-named-trial.exe'
          Build-VersionedAgentDock -Version '0.0.0-named-source-e2e' -OutputPath $sourceCore
          Build-VersionedAgentDock -Version '999.0.0-named-trial-e2e' -OutputPath $trialCore

          & .\scripts\test\test-windows-named-tunnel-lifecycle.ps1 `
            -InstallerPath .\scripts\install\install.ps1 `
            -UninstallerPath .\scripts\install\uninstall-windows.ps1 `
            -TargetAgentDockArchive $env:AMD64_ARCHIVE `
            -TargetAgentDockChecksumFile $env:AMD64_CHECKSUM `
            -SourceCoreBinary $sourceCore `
            -TrialCoreBinary $trialCore `
            -FakeCloudflaredBinary $fakeCloudflared

      - name: Test Setup activation deferral
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-windows-setup-activation-deferred.ps1 `
            -InstallerPath .\scripts\install\install.ps1 `
            -AgentDockArchive $env:AMD64_ARCHIVE `
            -AgentDockChecksumFile $env:AMD64_CHECKSUM `
            -CloudflaredBinary $env:AMD64_CLOUDFLARED

      - name: Compile offline AMD64 Setup
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $testTag = '${{ inputs.test_tag }}'
          if ([string]::IsNullOrWhiteSpace($testTag)) {
            $buildInfo = Get-Content -LiteralPath '.\internal\buildinfo\buildinfo.go' -Raw
            $match = [regex]::Match($buildInfo, 'const\s+Version\s*=\s*"([^"]+)"')
            if (-not $match.Success) { throw 'Could not read buildinfo.Version.' }
            $version = $match.Groups[1].Value
          } else {
            if (-not $testTag.StartsWith('v')) { throw 'The test tag must start with v.' }
            $version = $testTag.Substring(1)
          }

          $outputDir = Join-Path $env:RUNNER_TEMP 'agentdock-setup'
          $parameters = @{
            Version = $version
            Architecture = 'amd64'
            AgentDockArchive = $env:AMD64_ARCHIVE
            AgentDockChecksumFile = $env:AMD64_CHECKSUM
            CloudflaredBinary = $env:AMD64_CLOUDFLARED
            OutputDirectory = $outputDir
          }
          if (-not [string]::IsNullOrWhiteSpace($testTag)) {
            $parameters.SignedBuild = $true
          }
          & .\packaging\windows\build-windows-offline-setup.ps1 @parameters

      - name: Run Setup install and uninstall E2E
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-windows-setup-e2e.ps1 `
            -SetupPath (Join-Path $env:RUNNER_TEMP 'agentdock-setup\AgentDockSetup-amd64.exe') `
            -LegacyCorePath .\dist\agentdock.exe `
            -LegacyTrayPath .\dist\agentdock-tray.exe `
            -AllowLegacyTaskMutation

      - name: Smoke test current binary as standard user
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-windows-current-binary-as-standard-user.ps1 `
            -BinaryPath .\dist\agentdock.exe


      - name: Build and publish signed Windows test package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          TEST_TAG: ${{ inputs.test_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:RUNNER_TEMP 'agentdock-windows-test-release'
          Remove-Item -LiteralPath $releaseDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item -LiteralPath $env:AMD64_ARCHIVE -Destination $releaseDir -Force
          Copy-Item -LiteralPath $env:AMD64_CHECKSUM -Destination $releaseDir -Force

          function New-WindowsAsset {
            param(
              [Parameter(Mandatory = $true)][string] $Architecture,
              [Parameter(Mandatory = $true)][string] $SourceDirectory
            )
            $assetName = "agentdock_windows_$Architecture.zip"
            $assetPath = Join-Path $releaseDir $assetName
            Copy-Item .\packaging\windows\compat\manage-windows.ps1 (Join-Path $SourceDirectory 'manage-windows.ps1') -Force
            Compress-Archive `
              -Path (Join-Path $SourceDirectory 'agentdock.exe'), (Join-Path $SourceDirectory 'agentdock-tray.exe'), (Join-Path $SourceDirectory 'agentdock-arbiter.exe'), (Join-Path $SourceDirectory 'agentdock-shim.exe'), (Join-Path $SourceDirectory 'agentdock-tray-shim.exe'), (Join-Path $SourceDirectory 'agentdock.ico'), (Join-Path $SourceDirectory 'manage-windows.ps1'), (Join-Path $SourceDirectory 'share'), (Join-Path $SourceDirectory 'wsl-helper') `
              -DestinationPath $assetPath `
              -Force
            $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText("$assetPath.sha256", "$hash  $assetName`n", [Text.UTF8Encoding]::new($false))
          }

          $arm64Dir = Join-Path $env:RUNNER_TEMP 'agentdock-windows-arm64'
          New-Item -ItemType Directory -Path $arm64Dir -Force | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'arm64'
          go build -trimpath -o (Join-Path $arm64Dir 'agentdock.exe') .\cmd\agentdock
          go build -trimpath -ldflags '-s -w' -o (Join-Path $arm64Dir 'agentdock-arbiter.exe') .\cmd\agentdock-arbiter
          go build -trimpath -ldflags '-s -w' -o (Join-Path $arm64Dir 'agentdock-shim.exe') .\cmd\agentdock-shim
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o (Join-Path $arm64Dir 'agentdock-tray-shim.exe') .\cmd\agentdock-shim
          $arm64ControlPanelOutput = Join-Path $arm64Dir 'control-panel'
          dotnet publish .\desktop\windows\control-panel\AgentDock.ControlPanel.csproj `
            -c Release `
            -r win-arm64 `
            --self-contained true `
            -o $arm64ControlPanelOutput
          Copy-Item (Join-Path $arm64ControlPanelOutput 'agentdock-tray.exe') (Join-Path $arm64Dir 'agentdock-tray.exe') -Force
          .\packaging\windows\sign-windows.ps1 -Path @(
            (Join-Path $arm64Dir 'agentdock.exe'),
            (Join-Path $arm64Dir 'agentdock-tray.exe'),
            (Join-Path $arm64Dir 'agentdock-arbiter.exe'),
            (Join-Path $arm64Dir 'agentdock-shim.exe'),
            (Join-Path $arm64Dir 'agentdock-tray-shim.exe')
          )
          python .\packaging\build-core-skill-bundle.py --output (Join-Path $arm64Dir 'share\agentdock\core-skills')
          & .\packaging\windows\build-wsl-helper-payload.ps1 -OutputDirectory (Join-Path $arm64Dir 'wsl-helper')
          Copy-Item .\packaging\windows\assets\agentdock.ico (Join-Path $arm64Dir 'agentdock.ico') -Force
          New-WindowsAsset -Architecture 'arm64' -SourceDirectory $arm64Dir

          $arm64Archive = Join-Path $releaseDir 'agentdock_windows_arm64.zip'
          & .\packaging\windows\build-windows-offline-setup.ps1 `
            -Version ($env:TEST_TAG.TrimStart('v')) `
            -Architecture arm64 `
            -AgentDockArchive $arm64Archive `
            -AgentDockChecksumFile "$arm64Archive.sha256" `
            -CloudflaredBinary $env:AMD64_CLOUDFLARED `
            -OutputDirectory $releaseDir `
            -SignedBuild

          $amd64Setup = Join-Path $env:RUNNER_TEMP 'agentdock-setup\AgentDockSetup-amd64.exe'
          Copy-Item -LiteralPath $amd64Setup -Destination $releaseDir -Force
          foreach ($setupName in @('AgentDockSetup-amd64.exe', 'AgentDockSetup-arm64.exe')) {
            $setupPath = Join-Path $releaseDir $setupName
            $setupHash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText(
              "$setupPath.sha256",
              "$setupHash  $setupName`n",
              [Text.UTF8Encoding]::new($false)
            )
          }

          gh release delete $env:TEST_TAG --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes 2>$null
          gh release create $env:TEST_TAG `
            (Get-ChildItem -LiteralPath $releaseDir -File | ForEach-Object FullName) `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --prerelease `
            --title "AgentDock Windows test $env:TEST_TAG" `
            --notes "Temporary Windows test build from commit $env:GITHUB_SHA. Uses the existing AgentDock self-signed Authenticode certificate."

  gate:
    name: Windows Installer gate
    needs: [changes, validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify installer validation result
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Windows installer change detection failed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$RELEVANT" == "true" ]]; then
            if [[ "$VALIDATE_RESULT" != "success" ]]; then
              echo "Windows installer validation did not pass: $VALIDATE_RESULT" >&2
              exit 1
            fi
            echo 'Windows installer-relevant changes passed full validation.'
            exit 0
          fi
          if [[ "$VALIDATE_RESULT" != "skipped" ]]; then
            echo "Unexpected Windows installer validation result for an unrelated change: $VALIDATE_RESULT" >&2
            exit 1
          fi
          echo 'Windows installer validation not required for this change.'
