name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    name: Build Linux ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          asset="agentdock_linux_${GOARCH}.tar.gz"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          source_commit="$(git rev-parse HEAD)"
          mkdir -p dist/bin
          go build -trimpath \
            -ldflags="-s -w -X github.com/uvwt/agentdock/internal/buildinfo.Commit=${source_commit} -X github.com/uvwt/agentdock/internal/buildinfo.BuildDate=${build_date}" \
            -o dist/bin/agentdock ./cmd/agentdock
          python3 packaging/build-core-skill-bundle.py --output dist/share/agentdock/core-skills
          tar -C dist -czf "$asset" bin/agentdock share/agentdock/core-skills
          shasum -a 256 "$asset" > "$asset.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-linux-${{ matrix.goarch }}
          path: |
            agentdock_linux_${{ matrix.goarch }}.tar.gz
            agentdock_linux_${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.goarch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          asset="agentdock_darwin_${GOARCH}.tar.gz"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          source_commit="$(git rev-parse HEAD)"
          mkdir -p dist/bin
          go build -trimpath \
            -ldflags="-s -w -X github.com/uvwt/agentdock/internal/buildinfo.Commit=${source_commit} -X github.com/uvwt/agentdock/internal/buildinfo.BuildDate=${build_date}" \
            -o dist/bin/agentdock ./cmd/agentdock
          python3 packaging/build-core-skill-bundle.py --output dist/share/agentdock/core-skills
          tar -C dist -czf "$asset" bin/agentdock share/agentdock/core-skills
          shasum -a 256 "$asset" > "$asset.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-macos-${{ matrix.goarch }}
          path: |
            agentdock_darwin_${{ matrix.goarch }}.tar.gz
            agentdock_darwin_${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

  build-macos-app:
    name: Build macOS offline DMG
    needs: build-macos
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download AgentDock macOS payloads
        uses: actions/download-artifact@v4
        with:
          pattern: agentdock-macos-*
          path: payload
          merge-multiple: true

      - name: Prepare cloudflared macOS payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          for architecture in amd64 arm64; do
            archive="$RUNNER_TEMP/cloudflared-darwin-$architecture.tgz"
            extract_dir="$RUNNER_TEMP/cloudflared-$architecture"
            curl -fL --retry 5 --retry-delay 2 \
              "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-$architecture.tgz" \
              -o "$archive"
            mkdir -p "$extract_dir"
            tar -xzf "$archive" -C "$extract_dir"
            test -f "$extract_dir/cloudflared"
            test ! -L "$extract_dir/cloudflared"

            output="payload/cloudflared_darwin_$architecture"
            install -m 0755 "$extract_dir/cloudflared" "$output"
            case "$architecture" in
              arm64) expected_file_architecture='arm64' ;;
              amd64) expected_file_architecture='x86_64' ;;
            esac
            file_output="$(file "$output")"
            [[ "$file_output" == *"$expected_file_architecture"* ]]
            codesign --verify --deep --strict --verbose=2 "$output"
            (
              cd payload
              shasum -a 256 "cloudflared_darwin_$architecture" > "cloudflared_darwin_$architecture.sha256"
            )
          done

          (
            cd payload
            shasum -a 256 -c agentdock_darwin_amd64.tar.gz.sha256
            shasum -a 256 -c agentdock_darwin_arm64.tar.gz.sha256
            shasum -a 256 -c cloudflared_darwin_amd64.sha256
            shasum -a 256 -c cloudflared_darwin_arm64.sha256
          )

      - name: Validate menu app
        run: ./scripts/test/test-macos-app.sh

      - name: Build universal menu app
        env:
          AGENTDOCK_MACOS_ARCHES: arm64,x86_64
          AGENTDOCK_MACOS_APP_OUTPUT_DIR: dist/macos-app
          AGENTDOCK_MACOS_OFFLINE_PAYLOAD_DIR: ${{ github.workspace }}/payload
        run: packaging/macos/build-app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-macos-dmg
          path: |
            dist/macos-app/AgentDock-macos-universal.dmg
            dist/macos-app/AgentDock-macos-universal.dmg.sha256
            dist/macos-app/AgentDock-macos-universal.zip
            dist/macos-app/AgentDock-macos-universal.zip.sha256
          if-no-files-found: error

  build-windows:
    name: Build Windows ${{ matrix.goarch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test Windows private storage
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./internal/envstore ./internal/fs/securepath

      - name: Download and validate exact installer bytes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadedInstaller = Join-Path $env:RUNNER_TEMP 'install-downloaded.ps1'
          $installerUrl = 'https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/install/install.ps1'
          & .\scripts\test\test-install-windows-download.ps1 `
            -Url $installerUrl `
            -ExpectedInstallerPath .\scripts\install\install.ps1 `
            -OutputPath $downloadedInstaller
          "DOWNLOADED_INSTALLER=$downloadedInstaller" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

      - name: Validate downloaded installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-install-windows.ps1 -InstallerPath $env:DOWNLOADED_INSTALLER

      - name: Require Authenticode configuration
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            throw 'WINDOWS_SIGNING_CERT_BASE64 is required for a formal release.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            throw 'WINDOWS_SIGNING_CERT_PASSWORD is required for a formal release.'
          }

      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDate = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $sourceCommit = (git rev-parse HEAD).Trim()
          $ldflags = "-s -w -X github.com/uvwt/agentdock/internal/buildinfo.Commit=$sourceCommit -X github.com/uvwt/agentdock/internal/buildinfo.BuildDate=$buildDate"
          $runtimeIdentifier = if ($env:GOARCH -eq 'arm64') { 'win-arm64' } else { 'win-x64' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          go build -trimpath -ldflags $ldflags -o dist/agentdock.exe ./cmd/agentdock
          dotnet publish .\desktop\windows\control-panel\AgentDock.ControlPanel.csproj `
            -c Release `
            -r $runtimeIdentifier `
            --self-contained true `
            -o dist\control-panel
          Copy-Item .\dist\control-panel\agentdock-tray.exe .\dist\agentdock-tray.exe -Force

      - name: Smoke test current binary as standard user
        if: matrix.goarch == 'amd64'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-windows-current-binary-as-standard-user.ps1 `
            -BinaryPath .\dist\agentdock.exe

      - name: Authenticode sign and verify
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          .\packaging\windows\sign-windows.ps1 -Path @(
            '.\dist\agentdock.exe',
            '.\dist\agentdock-tray.exe'
          )

      - name: Package
        shell: pwsh
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "agentdock_windows_$env:GOARCH.zip"
          python .\packaging\build-core-skill-bundle.py --output dist\share\agentdock\core-skills
          Copy-Item .\packaging\windows\assets\agentdock.ico dist\agentdock.ico -Force
          Copy-Item .\scripts\install\manage-windows.ps1 dist\manage-windows.ps1 -Force
          Compress-Archive -Path dist\agentdock.exe, dist\agentdock-tray.exe, dist\agentdock.ico, dist\manage-windows.ps1, dist\share -DestinationPath $asset -Force
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$asset.sha256", "$hash  $asset`n", [Text.UTF8Encoding]::new($false))

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-windows-${{ matrix.goarch }}
          path: |
            agentdock_windows_${{ matrix.goarch }}.zip
            agentdock_windows_${{ matrix.goarch }}.zip.sha256
          if-no-files-found: error

  build-windows-setup:
    name: Build signed Windows offline Setup ${{ matrix.goarch }}
    needs: build-windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download Windows payload
        uses: actions/download-artifact@v4
        with:
          name: agentdock-windows-${{ matrix.goarch }}
          path: payload

      - name: Require Authenticode configuration
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            throw 'WINDOWS_SIGNING_CERT_BASE64 is required for a formal release.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            throw 'WINDOWS_SIGNING_CERT_PASSWORD is required for a formal release.'
          }

      - name: Download and verify cloudflared compatibility payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'payload\cloudflared.exe'
          Invoke-WebRequest `
            -UseBasicParsing `
            -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' `
            -OutFile $path
          $signature = Get-AuthenticodeSignature -LiteralPath $path
          if ($signature.Status -ne [Management.Automation.SignatureStatus]::Valid) {
            throw "cloudflared Authenticode signature is invalid: $($signature.StatusMessage)"
          }

      - name: Build and sign offline Setup
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          $version = $tag.TrimStart('v')
          $outputDir = Join-Path $PWD 'dist'
          & .\packaging\windows\build-windows-offline-setup.ps1 `
            -Version $version `
            -Architecture '${{ matrix.goarch }}' `
            -AgentDockArchive '.\payload\agentdock_windows_${{ matrix.goarch }}.zip' `
            -AgentDockChecksumFile '.\payload\agentdock_windows_${{ matrix.goarch }}.zip.sha256' `
            -CloudflaredBinary '.\payload\cloudflared.exe' `
            -OutputDirectory $outputDir `
            -SignedBuild

      - name: Upload Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentdock-windows-setup-${{ matrix.goarch }}
          path: dist/AgentDockSetup-${{ matrix.goarch }}.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-macos-app, build-windows, build-windows-setup]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package installers
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp scripts/install/install.sh dist/install.sh
          cp scripts/install/install-linux-platform.sh dist/install-linux-platform.sh
          cp scripts/install/uninstall-linux.sh dist/uninstall-linux.sh
          cp scripts/install/install-macos-platform.sh dist/install-macos-platform.sh
          cp scripts/install/uninstall-macos.sh dist/uninstall-macos.sh
          cp scripts/install/install.ps1 dist/install.ps1
          cp scripts/install/uninstall-windows.ps1 dist/uninstall-windows.ps1
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          repository = os.environ["RELEASE_REPOSITORY"].lower()
          expected_version = tag.removeprefix("v")
          buildinfo_source = Path("internal/buildinfo/buildinfo.go").read_text()
          version_match = re.search(r'^\s*const\s+Version\s*=\s*"([^"]+)"', buildinfo_source, re.MULTILINE)
          if version_match is None:
              raise SystemExit("could not read buildinfo.Version from internal/buildinfo/buildinfo.go")
          actual_version = version_match.group(1)
          if actual_version != expected_version:
              raise SystemExit(f"release tag {tag} does not match buildinfo.Version {actual_version}")

          # Docker Compose / .env.example 不作为 Release 资产发布；
          # 文档直接引用仓库 main 或对应 git tag 上的源文件。
          installer_entry = Path("dist/install.sh")
          installer_text = installer_entry.read_text()
          default_base = "https://github.com/uvwt/agentdock/releases/latest/download"
          release_base = f"https://github.com/{repository}/releases/download/{tag}"
          if default_base not in installer_text:
              raise SystemExit("install.sh default release base was not found")
          installer_entry.write_text(installer_text.replace(default_base, release_base, 1))
          PY
          (
            cd dist
            for file in \
              install.sh \
              install-linux-platform.sh \
              uninstall-linux.sh \
              install-macos-platform.sh \
              uninstall-macos.sh \
              install.ps1 \
              uninstall-windows.ps1 \
              AgentDockSetup-amd64.exe \
              AgentDockSetup-arm64.exe; do
              shasum -a 256 "$file" > "$file.sha256"
            done
          )

      - name: Validate macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/AgentDock-macos-universal.dmg
          test -f dist/AgentDock-macos-universal.dmg.sha256
          test -f dist/AgentDock-macos-universal.zip
          test -f dist/AgentDock-macos-universal.zip.sha256
          (cd dist && shasum -a 256 -c AgentDock-macos-universal.zip.sha256)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/*.sh
            dist/*.sh.sha256
            dist/*.ps1
            dist/*.ps1.sha256
            dist/*.exe
            dist/*.exe.sha256
          generate_release_notes: true

  publish-container:
    name: Publish container (${{ matrix.variant }})
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 三个多架构镜像并发推送会触发 GHCR secondary rate limit，发布阶段串行执行。
      max-parallel: 1
      matrix:
        include:
          - variant: runtime
            target: runtime
            latest_tag: latest
            tag_prefix: ''
          - variant: dev
            target: dev
            latest_tag: dev-latest
            tag_prefix: dev-
          - variant: browser
            target: browser
            latest_tag: browser-latest
            tag_prefix: browser-
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            agentdockio/agentdock
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.tag_prefix }}${{ github.event.inputs.tag || github.ref_name }},priority=1000
            type=raw,value=${{ matrix.latest_tag }},priority=100

      - name: Prepare image build metadata
        id: build
        shell: bash
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ steps.build.outputs.commit }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }},ignore-error=true

  verify-linux-release:
    name: Verify published unified installer on Linux
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download and run published installer
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_base="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
          installer="$RUNNER_TEMP/install.sh"
          installer_tmp="$RUNNER_TEMP/installer"
          install_dir="$RUNNER_TEMP/agentdock-install"
          data_dir="$RUNNER_TEMP/agentdock-data"
          env_file="$RUNNER_TEMP/agentdock.env"

          mkdir -p "$installer_tmp"
          curl -fL "$release_base/install.sh" -o "$installer"
          curl -fL "$release_base/install.sh.sha256" -o "$installer.sha256"
          (
            cd "$RUNNER_TEMP"
            sha256sum -c install.sh.sha256
          )

          TMPDIR="$installer_tmp" \
          AGENTDOCK_INSTALLER_BASE_URL="$release_base" \
          AGENTDOCK_NONINTERACTIVE=true \
          AGENTDOCK_INSTALL_MODE=binary \
          AGENTDOCK_RELEASE_VERSION="$RELEASE_TAG" \
          AGENTDOCK_SOURCE_DIR="$install_dir" \
          AGENTDOCK_DATA_DIR="$data_dir" \
          AGENTDOCK_ENV_FILE="$env_file" \
          AGENTDOCK_SERVICE_MANAGER=none \
          AGENTDOCK_SERVICE_USER="$(id -un)" \
          AGENTDOCK_AUTH_TOKEN=test-token \
            sh "$installer"

          "$install_dir/bin/agentdock" --help >/dev/null 2>&1

          test -f "$data_dir/.agentdock/skill-store/bundled-skills.json"
          for skill in skill-authoring skill-installation; do
            state="$data_dir/.agentdock/skill-store/state/$skill.json"
            version="$(jq -r .active_version "$state")"
            test -n "$version"
            test -f "$data_dir/.agentdock/skill-store/installed/$skill/$version/SKILL.md"
          done

          systemd_dir="$RUNNER_TEMP/systemd"
          openrc_dir="$RUNNER_TEMP/openrc"
          mkdir -p "$systemd_dir" "$openrc_dir"
          AGENTDOCK_INSTALLER_BASE_URL="$release_base" \
          AGENTDOCK_SOURCE_DIR="$install_dir" \
          AGENTDOCK_DATA_DIR="$data_dir" \
          AGENTDOCK_ENV_FILE="$env_file" \
          AGENTDOCK_SYSTEMD_DIR="$systemd_dir" \
          AGENTDOCK_OPENRC_DIR="$openrc_dir" \
            sh "$installer" --uninstall --purge-data

          test ! -e "$install_dir"
          test ! -e "$data_dir"
          test ! -e "$env_file"

  verify-macos-release:
    name: Verify published unified installer on macOS
    needs: publish
    runs-on: macos-latest
    steps:
      - name: Download and run published installer
        shell: zsh {0}
        run: |
          set -euo pipefail
          tag='${{ github.event.inputs.tag || github.ref_name }}'
          release_base="https://github.com/${{ github.repository }}/releases/download/$tag"
          installer="$RUNNER_TEMP/install.sh"
          uninstaller="$RUNNER_TEMP/uninstall-macos.sh"
          dmg="$RUNNER_TEMP/AgentDock-macos-universal.dmg"
          zip="$RUNNER_TEMP/AgentDock-macos-universal.zip"
          zip_dir="$RUNNER_TEMP/agentdock-zip"
          mount_dir="$RUNNER_TEMP/agentdock-dmg"
          dmg_mounted=false
          cleanup() {
            if [[ "$dmg_mounted" == true ]]; then
              hdiutil detach "$mount_dir" -force >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          curl -fL "$release_base/AgentDock-macos-universal.dmg" -o "$dmg"
          curl -fL "$release_base/AgentDock-macos-universal.dmg.sha256" -o "$dmg.sha256"
          curl -fL "$release_base/AgentDock-macos-universal.zip" -o "$zip"
          curl -fL "$release_base/AgentDock-macos-universal.zip.sha256" -o "$zip.sha256"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 -c AgentDock-macos-universal.dmg.sha256
            shasum -a 256 -c AgentDock-macos-universal.zip.sha256
          )
          mkdir -p "$zip_dir"
          ditto -x -k "$zip" "$zip_dir"
          test -d "$zip_dir/AgentDock.app"
          codesign --verify --deep --strict --verbose=2 "$zip_dir/AgentDock.app"
          hdiutil verify "$dmg" >/dev/null
          mkdir -p "$mount_dir"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg" >/dev/null
          dmg_mounted=true
          mounted_entries="$(find "$mount_dir" -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort)"
          test "$mounted_entries" = $'AgentDock.app\nApplications'
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = "/Applications"
          codesign --verify --deep --strict --verbose=2 "$mount_dir/AgentDock.app"
          app_arches="$(lipo -archs "$mount_dir/AgentDock.app/Contents/MacOS/AgentDock")"
          helper_arches="$(lipo -archs "$mount_dir/AgentDock.app/Contents/Helpers/AgentDockLoginHelper")"
          core_arches="$(lipo -archs "$mount_dir/AgentDock.app/Contents/Helpers/agentdock")"
          cloudflared_arches="$(lipo -archs "$mount_dir/AgentDock.app/Contents/Helpers/cloudflared")"
          [[ "$app_arches" == *arm64* && "$app_arches" == *x86_64* ]]
          [[ "$helper_arches" == *arm64* && "$helper_arches" == *x86_64* ]]
          [[ "$core_arches" == *arm64* && "$core_arches" == *x86_64* ]]
          [[ "$cloudflared_arches" == *arm64* && "$cloudflared_arches" == *x86_64* ]]
          cmp \
            "$zip_dir/AgentDock.app/Contents/MacOS/AgentDock" \
            "$mount_dir/AgentDock.app/Contents/MacOS/AgentDock"
          cmp \
            "$zip_dir/AgentDock.app/Contents/Helpers/AgentDockLoginHelper" \
            "$mount_dir/AgentDock.app/Contents/Helpers/AgentDockLoginHelper"
          cmp \
            "$zip_dir/AgentDock.app/Contents/Helpers/agentdock" \
            "$mount_dir/AgentDock.app/Contents/Helpers/agentdock"
          cmp \
            "$zip_dir/AgentDock.app/Contents/Helpers/cloudflared" \
            "$mount_dir/AgentDock.app/Contents/Helpers/cloudflared"
          test -f "$mount_dir/AgentDock.app/Contents/Resources/core-skills/manifest.json"
          core_plist="$mount_dir/AgentDock.app/Contents/Library/LaunchAgents/com.uvwt.agentdock.core.plist"
          tunnel_plist="$mount_dir/AgentDock.app/Contents/Library/LaunchAgents/com.uvwt.agentdock.tunnel.plist"
          plutil -lint "$core_plist" >/dev/null
          plutil -lint "$tunnel_plist" >/dev/null
          test "$(plutil -extract BundleProgram raw -o - "$core_plist")" = "Contents/Helpers/agentdock"
          test "$(plutil -extract BundleProgram raw -o - "$tunnel_plist")" = "Contents/Helpers/agentdock"
          codesign --verify --strict --verbose=2 "$mount_dir/AgentDock.app/Contents/Helpers/agentdock"
          codesign --verify --strict --verbose=2 "$mount_dir/AgentDock.app/Contents/Helpers/cloudflared"
          mounted_core_version="$("$mount_dir/AgentDock.app/Contents/Helpers/agentdock" --version)"
          [[ "$mounted_core_version" == *"AgentDock $tag"* ]]
          "$mount_dir/AgentDock.app/Contents/Helpers/cloudflared" --version >/dev/null
          hdiutil detach "$mount_dir" >/dev/null
          dmg_mounted=false

          curl -fL "$release_base/install.sh" -o "$installer"
          curl -fL "$release_base/install.sh.sha256" -o "$installer.sha256"
          curl -fL "$release_base/uninstall-macos.sh" -o "$uninstaller"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 -c install.sh.sha256
          )
          sh -n "$installer"
          zsh -n "$uninstaller"
          HOME="$RUNNER_TEMP/home" \
          AGENTDOCK_INSTALLER_BASE_URL="$release_base" \
          AGENTDOCK_INSTALL_DIR="$RUNNER_TEMP/bin" \
            sh "$installer" --version "$tag"
          "$RUNNER_TEMP/bin/agentdock" --help >/dev/null 2>&1
          test -f "$RUNNER_TEMP/home/.agentdock/skill-store/bundled-skills.json"
          for skill in skill-authoring skill-installation; do
            state="$RUNNER_TEMP/home/.agentdock/skill-store/state/$skill.json"
            version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["active_version"])' "$state")"
            test -f "$RUNNER_TEMP/home/.agentdock/skill-store/installed/$skill/$version/SKILL.md"
          done

  verify-windows-release:
    name: Verify published Windows installer
    needs: publish
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download published installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          $downloadedInstaller = Join-Path $env:RUNNER_TEMP 'install-release.ps1'
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/install.ps1"
          & .\scripts\test\test-install-windows-download.ps1 `
            -Url $installerUrl `
            -ExpectedInstallerPath .\scripts\install\install.ps1 `
            -OutputPath $downloadedInstaller
          "DOWNLOADED_INSTALLER=$downloadedInstaller" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          $setup = Join-Path $env:RUNNER_TEMP 'AgentDockSetup-amd64.exe'
          Invoke-WebRequest `
            -UseBasicParsing `
            -Uri "https://github.com/${{ github.repository }}/releases/download/$tag/AgentDockSetup-amd64.exe" `
            -OutFile $setup
          "PUBLISHED_SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

      - name: Verify published Setup signature
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          .\packaging\windows\sign-windows.ps1 -Path $env:PUBLISHED_SETUP -VerifyOnly

      - name: Install and uninstall published Setup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\test-windows-setup-e2e.ps1 `
            -SetupPath $env:PUBLISHED_SETUP `
            -AllowLegacyTaskMutation

      - name: Install and upgrade published version as standard user
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\test\run-windows-installer-e2e-as-standard-user.ps1 `
            -InstallerPath $env:DOWNLOADED_INSTALLER `
            -Version $env:RELEASE_TAG

  verify-container:
    name: Verify published containers
    needs: publish-container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run published GHCR images
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          AGENTDOCK_TEST_BUILD: "false"
          AGENTDOCK_TEST_RUNTIME_IMAGE: ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag || github.ref_name }}
          AGENTDOCK_TEST_DEV_IMAGE: ghcr.io/${{ github.repository }}:dev-${{ github.event.inputs.tag || github.ref_name }}
          AGENTDOCK_TEST_BROWSER_IMAGE: ghcr.io/${{ github.repository }}:browser-${{ github.event.inputs.tag || github.ref_name }}
          AGENTDOCK_EXPECT_IMAGE_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: ./scripts/test/test-docker-images.sh

      - name: Run published Docker Hub images
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          AGENTDOCK_TEST_BUILD: "false"
          AGENTDOCK_TEST_RUNTIME_IMAGE: agentdockio/agentdock:${{ github.event.inputs.tag || github.ref_name }}
          AGENTDOCK_TEST_DEV_IMAGE: agentdockio/agentdock:dev-${{ github.event.inputs.tag || github.ref_name }}
          AGENTDOCK_TEST_BROWSER_IMAGE: agentdockio/agentdock:browser-${{ github.event.inputs.tag || github.ref_name }}
          AGENTDOCK_EXPECT_IMAGE_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: ./scripts/test/test-docker-images.sh
