    deletable: true

  - path: scripts/test/test-install-entry.sh
    class: test
    owner: installer
    public_contract: false
    deletable: false
    legacy_oversize: true
    oversize_justification: 覆盖公开 install.sh 下载、校验、卸载和参数透传。

  - path: scripts/test/test-install-macos.sh
    class: test
    owner: installer
    public_contract: false
    deletable: false
    legacy_oversize: true
    oversize_justification: macOS 安装器平台 E2E，负责 VM/权限之外的环境编排。

  - path: scripts/test/linux-installer-e2e-vps.sh
    class: test
    owner: installer
    public_contract: false
    deletable: false
    oversize_justification: Linux Installer Engine VPS E2E（非 root + sudo + systemd + 身份/属主断言），URL 经 env 注入。

  - path: scripts/test/test-macos-app.sh
